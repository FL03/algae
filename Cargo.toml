[workspace]
default-members = [
    "algae"
]

exclude = [
    "mmr",
]

members = [
    "algae", 
    "core",
    "graph",
    "merkle",
]

resolver = "2"

[workspace.dependencies]
anyhow = "1"
itertools = "0.13"
lazy_static = "1"
num = { default-features = false, version = "0.4" }
paste = "1"
smart-default = "0.7"
strum = { default-features = false, features = ["derive"], version = "0.26" }

[workspace.package]
authors = ["FL03 <jo3mccain@icloud.com>"]
categories = []
description = "Algae is a collection of core algorithms and data-structures, written in Rust"
edition = "2021"
homepage = "https://github.com/scattered-systems/algae/wiki"
keywords = ["algorithms", "data-structures"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/algae"
version = "0.1.20"

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
panic = "unwind"
rpath = false
opt-level = 0

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = false
panic = "unwind"
rpath = false
opt-level = "z"
