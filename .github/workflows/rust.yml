name: Rust

concurrency: 
  cancel-in-progress: false
  group: ${{ github.event.repository.name }}-rust

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches: [ main ]
    tags: [ nightly*, v*.*.*]
  release:
    types: [ created ]
  repository_dispatch:
    types: [ rust ]
  schedule:
    - cron: 30 21 * * 0 # Every Sunday at 9:30PM UTC
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    name: Build
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
        target: [ wasm32-unknown-unknown, wasm32-wasi ]
        toolchain: [ stable, nightly ]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: setup (rustup)
        run: rustup default ${{ matrix.toolchain }} && rustup update
      - name: target (${{ matrix.target }})
        if: matrix.toolchain == 'nightly'
        run: rustup target add ${{ matrix.target }}
      - name: cargo (build)
        run: cargo build --features full -r -v --workspace
      - name: cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
      - name: cargo (test)
        run: cargo test --all-features -r -v --workspace
  benchmark:
    name: Bench
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup default nightly && rustup update
      - name: cargo (bench)
        run: cargo bench --features full -v --workspace
