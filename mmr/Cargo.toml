[package]
authors = ["FL03 <jo3mccain@icloud.com>"]
categories = []
description = "Algae is a collection of core algorithms and data-structures, written in Rust"
edition = "2021"
homepage = "https://github.com/scattered-systems/algae/wiki"
keywords = ["algorithms", "data-structures"]
license = "Apache-2.0"
name = "algae-mmr"
readme = "README.md"
repository = "https://github.com/FL03/algae"
version = "0.1.20"

[features]
default = [
    "std",
]

full = [
    "default",
]
# ********* [FF] Dependencies *********]
serde = [
    "dep:serde",
    "dep:serde_json",
]

std = [
    "serde/std",
]

[lib]
crate-type = ["cdylib", "rlib"]
test = true

[dependencies]
anyhow = "1"
digest = "0.10"
hex = "0.4"
itertools = "0.13"
serde_json = "1"
smart-default = "0.7"

[dependencies.decanter]
features = ["derive"]
version = "0.1.6"

[dependencies.serde]
default-features = false
optional = true
features = ["derive"]
version = "1"

[dependencies.strum]
default-features = false
features = ["derive"]
version = "0.26"

[dev-dependencies]
hex-literal = "0.4"
vrf = "0.2"

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs"]

[target.wasm32-unknown-unknown]

[target.wasm32-wasi]
